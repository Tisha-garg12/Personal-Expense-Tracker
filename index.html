<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Student 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2>PERSONAL EXPENSE TRACKER</h2>

        <section class="balance-section" aria-label="Current balance">
            <h4>Your Balance</h4>
            <h1 id="bal">₹0.00</h1>
        </section>

        <section class="inc-exp-container" aria-label="Income and expenses">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money-plus">₹0.00</p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money-minus">₹0.00</p>
            </div>
        </section>

        <h3>History</h3>
        <ul class="list" id="list" aria-live="polite"></ul>

        <h3>Add New Transaction</h3>
        <form id="form">
            <div class="form-control">
    <label for="text">Description</label>
    <input type="text" id="text"
           placeholder="Enter Text..." required>
</div>

<div class="form-control">
    <label for="amount">Amount</label>
    <input type="number" id="amount"
           placeholder="Enter Amount..."
           step="0.01" required>
</div>
            <button type="submit" class="btn">Add Transaction</button>
        </form>
        <p class="hint">Enter a positive amount for income and a negative amount for an expense.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
